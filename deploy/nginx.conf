# Connection header: "upgrade" for WebSocket, "" for HTTP (keep-alive)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Rate limit: 10 req/min per IP on /api/login (anti-brute-force)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name uyuni-proxy.internal;   # change to your hostname
    server_tokens off;

    ssl_certificate     /opt/ssouuni/ssl/cert.pem;
    ssl_certificate_key /opt/ssouuni/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass            http://127.0.0.1:5002;
        proxy_http_version    1.1;
        include               /etc/nginx/proxy_params;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
    }

    location / {
        proxy_pass            http://127.0.0.1:5002;
        proxy_http_version    1.1;
        include               /etc/nginx/proxy_params;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name uyuni-proxy.internal;   # change to your hostname
    server_tokens off;
    return 301 https://$host$request_uri;
}
